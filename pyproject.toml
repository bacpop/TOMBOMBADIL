[project]
name = "tombombadil"
version = "0.1.0"
description = "JAX rewrite of TOMBOMBADIL"
authors = [
    { name = "John Lees", email = "jlees@ebi.ac.uk" },
    { name = "Leonie Lorenz" },
    { name = "Matthew Russell", email = "matthewjohnrussell@gmail.com" },
]
license = "Apache 2.0"
requires-python = ">=3.14"
dependencies = ["jax (>=0.8.1)", "numpy (>=2.3.5)", "scipy (>=1.16.3)", "matplotlib (>=3.10.7)", "optax (>=0.2.8)", "blackjax (>=1.3)"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
